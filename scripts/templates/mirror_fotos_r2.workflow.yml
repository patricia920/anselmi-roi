name: Mirror fotos to R2

# Espelha todas as fotos do photo.anselmi.ind.br pro Cloudflare R2.
#
# Fonte: data/banco_fotos.json gerado LOCAL via build_banco_fotos_v2.py
# (lê os dumps Oracle/Sisplan que já estão no anselmi-pcp). ~42k URLs.
# NÃO depende de PAT cross-repo — tudo no próprio anselmi-pcp.
#
# Pré-requisitos (Secrets do anselmi-pcp):
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_ENDPOINT          (ex: https://abc123.r2.cloudflarestorage.com)
#   R2_PUBLIC_BASE       (ex: https://pub-XXX.r2.dev — URL do Public bucket)

on:
  schedule:
    - cron: '0 9 * * *'   # 6h BRT (UTC-3) — depois do auto_overrides diário
  workflow_dispatch:       # botão manual no GitHub Actions
    inputs:
      full:
        description: "Reupload TUDO (ignora cache R2)?"
        type: boolean
        default: false

permissions:
  contents: write          # pra commitar fotos_r2.json + manifest

concurrency:
  group: mirror-fotos-r2
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 42k URLs × ~300ms = ~15min worst case
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet boto3 requests

      - name: Gera banco_fotos.json (a partir dos dumps Oracle/Sisplan locais)
        run: |
          set -e
          if [ ! -f scripts/build_banco_fotos_v2.py ]; then
            echo "❌ scripts/build_banco_fotos_v2.py não encontrado"
            exit 1
          fi
          python3 scripts/build_banco_fotos_v2.py
          if [ -f data/banco_fotos.json ]; then
            REFS=$(python3 -c "import json; print(len(json.load(open('data/banco_fotos.json')).get('fotos', {})))")
            echo "✓ banco_fotos.json gerado · $REFS refs"
          else
            echo "❌ banco_fotos.json não foi gerado"
            exit 1
          fi

      - name: Run mirror_fotos_r2.py
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE:       ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET:            anselmi-fotos-mirror
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            python3 mirror_fotos_r2.py --full
          else
            python3 mirror_fotos_r2.py
          fi

      - name: Commit fotos_r2.json + manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos_r2.json fotos_r2_manifest.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "auto: mirror fotos → R2 ($(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M BRT'))"
            git push
          else
            echo "Nada mudou em fotos_r2.json"
          fi
